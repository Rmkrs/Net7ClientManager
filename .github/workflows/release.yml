name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.x"

    - name: Resolve version from tag
      shell: pwsh
      run: |
        $tag = $env:GITHUB_REF_NAME
        if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
          throw "Release tag '$tag' is not a supported semantic version tag (expected vX.Y.Z)."
        }
        "APP_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore dependencies
      run: dotnet restore Net7ClientManager.slnx

    - name: Publish self-contained Windows x64
      run: >
        dotnet publish Source/Net7ClientManager/Net7ClientManager.csproj
        --configuration Release
        --runtime win-x64
        --self-contained true
        --output publish
        -p:PublishSingleFile=false
        -p:Version=$env:APP_VERSION

    - name: Publish net7cmctl helper
      run: >
        dotnet publish Source/net7cmctl/net7cmctl.csproj
        --configuration Release
        --runtime win-x64
        --self-contained true
        --output publish-ctl
        -p:PublishSingleFile=true
        -p:Version=$env:APP_VERSION
        -p:DebugType=None
        -p:DebugSymbols=false

    - name: Add net7cmctl to app package
      run: Copy-Item publish-ctl/net7cmctl.exe publish/net7cmctl.exe
      shell: pwsh

    - name: Zip published app
      run: Compress-Archive -Path publish/* -DestinationPath Net7ClientManager-${{ github.ref_name }}-win-x64.zip
      shell: pwsh

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: Net7ClientManager-${{ github.ref_name }}-win-x64.zip
        generate_release_notes: true